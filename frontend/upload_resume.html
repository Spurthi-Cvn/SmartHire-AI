<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upload Resume</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

</head>

<body>

<div class="register-container">

<div class="register-card">

<div class="text-center mb-4">

<i class="fa-solid fa-file-arrow-up register-icon"></i>

<h2>Upload Resume</h2>

<p>Upload your latest resume in PDF format</p>

</div>

<form id="resumeForm">

<div class="mb-4">

<label class="form-label">Choose Resume (PDF)</label>

<input
type="file"
class="form-control"
id="resumeFile"
accept=".pdf"
required>

</div>

<div id="resumeLoading" style="display:none;" class="text-center mb-3">

<div class="spinner-border text-primary"></div>

<p class="mt-2">Uploading Resume...</p>

</div>
<button
    type="submit"
    class="btn btn-primary w-100">

    Upload Resume

</button>
</form>

<div class="text-center mt-4">

<a href="dashboard.html">

← Back to Dashboard

</a>

</div>

</div>

</div>

<script src="resume.js"></script>

</body>

</html>
