<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Review Documents | ASHHH Technologies</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container py-5">

    <div class="dashboard-card">

        <!-- HEADER -->

        <div class="text-center mb-4">

            <div
                style="
                    font-size:45px;
                    color:#2563eb;
                "
            >
                <i class="fa-solid fa-file-circle-check"></i>
            </div>

            <h2>
                Review Uploaded Documents
            </h2>

            <p class="text-muted">
                Please review all uploaded documents carefully
                before continuing.
            </p>

        </div>


        <hr>


        <!-- CANDIDATE INFORMATION -->

        <div class="mb-4">

            <h5>
                <i class="fa-solid fa-user"></i>
                Candidate Information
            </h5>

            <div class="table-responsive">

                <table class="table table-bordered">

                    <tr>
                        <th>Candidate Name</th>
                        <td id="candidateName">
                            Loading...
                        </td>
                    </tr>

                    <tr>
                        <th>Candidate ID</th>
                        <td id="candidateId">
                            Loading...
                        </td>
                    </tr>

                </table>

            </div>

        </div>


        <!-- DOCUMENTS -->

        <h5 class="mb-3">

            <i class="fa-solid fa-folder-open"></i>

            Uploaded Documents

        </h5>


        <div
            id="documentList"
            class="mb-4"
        >
        </div>


        <!-- CONFIRMATION -->

        <div
            class="alert alert-warning"
            id="confirmationBox"
        >

            <div class="form-check">

                <input
                    class="form-check-input"
                    type="checkbox"
                    id="confirmDocuments"
                >

                <label
                    class="form-check-label"
                    for="confirmDocuments"
                >

                    I have reviewed all the uploaded documents
                    and confirm that they are correct and belong
                    to me.

                </label>

            </div>

        </div>


        <!-- BUTTONS -->

        <div class="text-center mt-4">

            <a
                href="document-verification.html"
                class="btn btn-secondary me-2"
            >
                <i class="fa-solid fa-arrow-left"></i>
                Back
            </a>


            <button
                id="confirmBtn"
                class="btn btn-primary"
                disabled
            >

                <i class="fa-solid fa-circle-check"></i>

                Confirm Documents & Continue

            </button>

        </div>


        <!-- STATUS -->

        <div
            id="reviewStatus"
            class="text-center mt-4"
        ></div>

    </div>

</div>


<script src="document-review.js"></script>

</body>

</html>
