<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ATS Screening | ASHHH Technologies</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="dashboard-container">

<div class="container py-5">

<div class="d-flex justify-content-between align-items-center mb-4">

<h2 class="text-white">
<i class="fa-solid fa-robot"></i>
ATS Screening
</h2>

<a href="dashboard.html" class="btn btn-secondary">
← Dashboard
</a>

</div>


<!-- JOB DETAILS -->

<div class="dashboard-card mb-4">

<h4>
<i class="fa-solid fa-briefcase"></i>
Available Job
</h4>

<hr>

<p>
<strong>Job Title:</strong>
<span id="jobTitle">Loading...</span>
</p>

<p>
<strong>Required Skills:</strong>
</p>

<div id="requiredSkills">
Loading...
</div>

</div>


<!-- ATS RESULT -->

<div class="dashboard-card">

<h4>
<i class="fa-solid fa-chart-line"></i>
ATS Screening Result
</h4>

<hr>

<div id="loading" class="text-center">

<div class="spinner-border text-primary"></div>

<p class="mt-2">
Running ATS Screening...
</p>

</div>


<div id="result" style="display:none;">

<div class="text-center mb-4">

<h1 id="matchPercentage">
0%
</h1>

<p>
Resume Match Score
</p>

</div>


<div class="mb-4">

<h5>
Matched Skills
</h5>

<div id="matchedSkills"></div>

</div>


<div class="mb-4">

<h5>
Missing Skills
</h5>

<div id="missingSkills"></div>

</div>


<div class="text-center">

<h4 id="screeningStatus"></h4>

</div>

</div>

</div>

</div>

</div>

</div>


<script src="ats_screening.js"></script>

</body>

</html>
