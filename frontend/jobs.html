<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Jobs | SmartHire AI</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .jobs-page {
            min-height: 100vh;
            background: #f4f7fb;
            color: #17233d;
        }

        .jobs-header {
            background: #101d3a;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .jobs-header h2 {
            margin: 0;
        }

        .jobs-header a {
            color: white;
            text-decoration: none;
            margin-left: 22px;
        }

        .jobs-hero {
            background: linear-gradient(120deg, #14294e, #176b85);
            color: white;
            padding: 55px 7%;
        }

        .jobs-hero h1 {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .jobs-hero p {
            color: #dce9f5;
        }

        .jobs-search {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            max-width: 850px;
        }

        .jobs-search input {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 7px;
            font-size: 15px;
        }

        .jobs-search button {
            padding: 14px 25px;
            border: none;
            border-radius: 7px;
            background: #16b89a;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .jobs-container {
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 25px;
            padding: 35px 7%;
        }

        .jobs-filters,
        .job-card {
            background: white;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.05);
        }

        .jobs-filters h3 {
            margin-top: 0;
        }

        .filter-group {
            margin-top: 24px;
        }

        .filter-group label {
            display: block;
            margin-bottom: 9px;
            font-weight: 600;
        }

        .filter-group select {
            width: 100%;
            padding: 11px;
            border: 1px solid #dce3ec;
            border-radius: 6px;
        }

        .jobs-results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .job-card {
            margin-bottom: 17px;
        }

        .job-card h3 {
            color: #173b68;
            margin-top: 0;
        }

        .job-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            color: #64748b;
            font-size: 14px;
            margin: 14px 0;
        }

        .job-skills {
            color: #475569;
            line-height: 1.8;
            font-size: 14px;
        }

        .job-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #edf0f5;
            padding-top: 16px;
            margin-top: 16px;
        }

        .job-salary {
            color: #0b967d;
            font-weight: bold;
        }

        .apply-btn {
            background: #176b85;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 11px 22px;
            cursor: pointer;
        }

        .apply-btn:hover {
            background: #124d69;
        }

        .no-jobs {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
        }

        @media(max-width: 750px) {
            .jobs-container {
                grid-template-columns: 1fr;
                padding: 20px;
            }

            .jobs-search {
                flex-direction: column;
            }

            .jobs-header {
                flex-wrap: wrap;
                gap: 15px;
            }

            .jobs-hero h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body class="jobs-page">

    <header class="jobs-header">
        <h2>SmartHire AI</h2>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="jobs.html">Find Jobs</a>
            <a href="dashboard.html">My Application</a>
            <a href="login.html">Logout</a>
        </nav>
    </header>

    <section class="jobs-hero">
        <h1>Find Your Next Opportunity</h1>
        <p>Explore Cloud, AWS, DevOps and Software Engineering opportunities.</p>

        <div class="jobs-search">
            <input
                type="text"
                id="searchInput"
                placeholder="Search job title or skills..."
            >

            <button onclick="loadJobs()">Search Jobs</button>
        </div>
    </section>

    <main class="jobs-container">

        <aside class="jobs-filters">
            <h3>Filter Jobs</h3>

            <div class="filter-group">
                <label for="locationFilter">Location</label>
                <select id="locationFilter">
                    <option value="">All Locations</option>
                    <option value="Bengaluru">Bengaluru</option>
                    <option value="Pune">Pune</option>
                    <option value="Hyderabad">Hyderabad</option>
                    <option value="Chennai">Chennai</option>
                    <option value="Mysuru">Mysuru</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="experienceFilter">Experience</label>
                <select id="experienceFilter">
                    <option value="">All Experience Levels</option>
                    <option value="Fresher">Fresher</option>
                    <option value="0-2 Years">0-2 Years</option>
                    <option value="1-3 Years">1-3 Years</option>
                    <option value="2-4 Years">2-4 Years</option>
                    <option value="3-5 Years">3-5 Years</option>
                    <option value="4-6 Years">4-6 Years</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="typeFilter">Job Type</label>
                <select id="typeFilter">
                    <option value="">All Job Types</option>
                    <option value="Full Time">Full Time</option>
                    <option value="Internship">Internship</option>
                </select>
            </div>
        </aside>

        <section>
            <div class="jobs-results-header">
                <h2>Latest Job Openings</h2>
                <span id="jobCount">Loading jobs...</span>
            </div>

            <div id="jobsList">
                <p>Loading available opportunities...</p>
            </div>
        </section>

    </main>

    <script src="jobs.js"></script>

</body>
</html>
