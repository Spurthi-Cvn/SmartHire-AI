<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Technical Interview | ASHHH Technologies</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


<div class="container py-5">


    <!-- HEADER -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="text-white">

            <i class="fa-solid fa-code"></i>

            Technical Interview

        </h2>


        <a
            href="dashboard.html"
            class="btn btn-secondary">

            ← Dashboard

        </a>

    </div>



    <!-- INTERVIEW CARD -->

    <div class="dashboard-card">


        <div
            class="d-flex justify-content-between align-items-center">

            <h4>

                <i class="fa-solid fa-laptop-code"></i>

                AWS DevOps Technical Assessment

            </h4>


            <span class="badge bg-primary">

                5 Questions

            </span>

        </div>


        <hr>



        <!-- TIMER -->

        <div class="text-center mb-4">

            <h5>

                Time Remaining

            </h5>


            <h2
                id="timer"
                class="text-warning">

                10:00

            </h2>

        </div>



        <!-- QUESTION AREA -->

        <div id="questionContainer">


            <h5 id="questionNumber">

                Question 1 of 5

            </h5>


            <p
                id="questionText"
                class="mt-3">

                Loading question...

            </p>


            <div id="options">

            </div>


        </div>



        <!-- NEXT BUTTON -->

        <div class="text-end mt-4">

            <button
                id="nextBtn"
                type="button"
                class="btn btn-primary">

                Next Question →

            </button>

        </div>



        <!-- RESULT -->

        <div
            id="result"
            style="display:none;">

            <div class="text-center">

                <h2>

                    Technical Interview Completed

                </h2>


                <h3
                    id="score"
                    class="text-success mt-3">

                </h3>


                <p
                    id="resultMessage">

                </p>

            </div>


            <!-- REVIEW WILL BE ADDED HERE -->

        </div>


    </div>


</div>



<script src="technical.js"></script>


</body>

</html>
