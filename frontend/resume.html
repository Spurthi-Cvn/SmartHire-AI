<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Upload Resume | ASHHH Technologies</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Font Awesome -->

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        rel="stylesheet">


    <!-- Your CSS -->

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


    <div class="register-container">

        <div class="register-card">


            <!-- Header -->

            <div class="text-center mb-4">

                <i
                    class="fa-solid fa-file-arrow-up register-icon">
                </i>

                <h2>
                    Upload Resume
                </h2>

                <p>
                    Upload your latest resume in PDF format
                </p>

            </div>



            <!-- Resume Form -->

            <form id="resumeForm">


                <!-- File Selection -->

                <div class="mb-4">

                    <label
                        for="resumeFile"
                        class="form-label">

                        Choose Resume (PDF)

                    </label>


                    <input
                        type="file"
                        class="form-control"
                        id="resumeFile"
                        accept=".pdf,application/pdf"
                        required>

                </div>



                <!-- Loading -->

                <div
                    id="resumeLoading"
                    class="text-center mb-3"
                    style="display:none;">

                    <div
                        class="spinner-border text-primary"
                        role="status">

                    </div>


                    <p class="mt-2">

                        Uploading Resume...

                    </p>

                </div>



                <!-- Upload Button -->

                <button
                    type="submit"
                    class="btn btn-primary w-100">

                    <i
                        class="fa-solid fa-cloud-arrow-up me-2">
                    </i>

                    Upload Resume

                </button>


            </form>



            <!-- Back to Dashboard -->

            <div class="text-center mt-4">

                <a href="dashboard.html">

                    <i class="fa-solid fa-arrow-left me-1"></i>

                    Back to Dashboard

                </a>

            </div>


        </div>

    </div>



    <!-- Resume JavaScript -->

    <script src="resume.js"></script>


</body>

</html>
